name: Build Debug APK (dari FloatingAI.zip)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ekstrak proyek dari FloatingAI.zip
        run: |
          test -f FloatingAI.zip || { echo "FloatingAI.zip tidak ditemukan di root repository"; exit 1; }
          mkdir -p project
          unzip -q FloatingAI.zip -d project
          ls -la project

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Lint (tidak menggagalkan build)
        continue-on-error: true
        working-directory: project
        run: gradle lintDebug --stacktrace --console=plain

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --stacktrace --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: floating-ai-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload laporan build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: project/app/build/reports/
          if-no-files-found: ignore
